{% load static %}

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>AAC</title>
    <link rel="stylesheet" href="{% static 'core/style.css' %}">
</head>
<body>

<header class="navbar">
    <h1>AAC</h1>

    {% if user.is_authenticated %}
        <nav>
            <span>{{ user.username }}</span>
            <a href="{% url 'logout' %}">Sair</a>
        </nav>
    {% endif %}
</header>

<main class="container">

    {% if messages %}
        {% for message in messages %}
            <p class="message">{{ message }}</p>
        {% endfor %}
    {% endif %}

    {% block content %}
    {% endblock %}

</main>

</body>
</html>
